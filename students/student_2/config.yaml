random_state: 42
missing_threshold: 0.75
cost_matrix:
  cost_fp: 10.0
  cost_fn: 500.0
split:
  train_ratio: 0.80
  val_ratio: 0.20
  use_official_test: true
models:
  decision_tree:
    max_depth: 8
    min_samples_split: 20
    min_samples_leaf: 10
    class_weight: "balanced"
  logistic_regression:
    C: 0.1
    class_weight: "balanced"
    max_iter: 1000
  random_forest:
    n_estimators: 100
    max_depth: 12
    class_weight: "balanced"
  gradient_boosting:
    max_iter: 100
    learning_rate: 0.1
    max_depth: 6
