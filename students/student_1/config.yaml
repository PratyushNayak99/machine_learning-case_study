study_id: student_1
dataset_name: "AI4I 2020 Predictive Maintenance Dataset"
target_column: "Machine failure"
lead_algorithm: "Logistic Regression"
random_state: 42
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true
features:
  categorical:
    - "Type"
  numerical:
    - "Air temperature [K]"
    - "Process temperature [K]"
    - "Rotational speed [rpm]"
    - "Torque [Nm]"
    - "Tool wear [min]"
  excluded:
    - "UDI"
    - "Product ID"
    - "TWF"
    - "HDF"
    - "PWF"
    - "OSF"
    - "RNF"
models:
  logistic_regression:
    C: 1.0
    penalty: "l2"
    solver: "lbfgs"
    class_weight: "balanced"
    max_iter: 1000
  decision_tree:
    max_depth: 6
    min_samples_split: 10
    min_samples_leaf: 5
    class_weight: "balanced"
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
    class_weight: "balanced"
  gradient_boosting:
    max_iter: 100
    learning_rate: 0.1
    max_depth: 5
