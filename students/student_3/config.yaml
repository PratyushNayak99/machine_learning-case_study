study_id: student_3
dataset_name: "Condition Monitoring of Hydraulic Systems"
target_column: "cooler_condition"
lead_algorithm: "Random Forest"
random_state: 42
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratified: true
targets:
  classes:
    - 3
    - 20
    - 100
models:
  random_forest:
    n_estimators: 100
    max_depth: 12
    min_samples_split: 5
    class_weight: "balanced"
  decision_tree:
    max_depth: 8
    min_samples_split: 10
    class_weight: "balanced"
  logistic_regression:
    C: 1.0
    multi_class: "multinomial"
    class_weight: "balanced"
    max_iter: 1000
  gradient_boosting:
    max_iter: 100
    learning_rate: 0.1
    max_depth: 6
