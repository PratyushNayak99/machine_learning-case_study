study_id: student_4
dataset_name: "MetroPT-3 Operational Transit Compressor Dataset"
target_column: "failure_event"
lead_algorithm: "HistGradientBoosting"
random_state: 42
split:
  method: "chronological"
  train_end: "2020-05-31"
  val_end: "2020-06-30"
  test_start: "2020-07-01"
windowing:
  window_minutes: 15
  step_minutes: 15
  exclusion_buffer_hours: 6
models:
  gradient_boosting:
    max_iter: 100
    learning_rate: 0.1
    max_depth: 6
    class_weight: "balanced"
  random_forest:
    n_estimators: 80
    max_depth: 10
    class_weight: "balanced"
  decision_tree:
    max_depth: 6
    class_weight: "balanced"
  logistic_regression:
    C: 1.0
    class_weight: "balanced"
    max_iter: 1000
